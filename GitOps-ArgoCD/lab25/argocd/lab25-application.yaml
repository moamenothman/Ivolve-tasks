
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-app-lab25
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/moamenothman/Ivolve-tasks.git
    targetRevision: main
    path: GitOps-ArgoCD/lab25
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

