apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-app-lab23
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-app-lab23
  template:
    metadata:
      labels:
        app: jenkins-app-lab23
    spec:
      containers:
        - name: jenkins-app
          image: moamenothan1/jenkins-app:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-app-lab23
spec:
  selector:
    app: jenkins-app-lab23
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
